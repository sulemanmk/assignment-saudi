# Application Configuration
spring.application.name=product-manager

# Server Configuration
server.port=8080

# Database Configuration - H2 (default profile)
spring.datasource.url=jdbc:h2:mem:productdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Configuration
jwt.secret=LUzsc8yptwNZL5TpsMpEco5S94SdWsIA12jfj33kkk222kfffHHTTDDWWEERddfras344ffdss3344ffffghjuyTyIOPLUzsc8yptwNZL5TpsMpEco5S94SdWsIA12jfj33kkk222kfffHHTTDDWWEERddfras344ffdss3344ffffghjuyTyIOP
jwt.expiration=86400000

# OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Application Info
info.app.name=Product Manager API
info.app.description=Spring Boot application for managing products, users, and orders
info.app.version=1.0.0

# Logging Configuration
logging.level.root=INFO
logging.level.com.productmanager=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
